name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
      - name: Verify Pages artifact paths
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          test -f dist/index.html
          node -e "const fs=require('fs'); const html=fs.readFileSync('dist/index.html','utf8'); const base=process.env.BASE_PATH; if(!html.includes(`"${base}`) && !html.includes(`'${base}`) && !html.includes(`(${base}`) && !html.includes(`${base}assets/`)){ console.error('Expected BASE_PATH prefix not found in dist/index.html:', base); process.exit(1);} console.log('Verified BASE_PATH prefix in dist/index.html:', base);"

        run: npm install


      - name: Install Linux optional native deps
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
